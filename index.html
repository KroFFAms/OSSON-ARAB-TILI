<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muallimi soniy — Harflar va Tajvid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--s:1;--bg:#fbf7ef;--fg:#1d2a24;--card:#fff;--acc:#0f6b4f;--acc2:#b8860b;--warn:#b3261e;--line:#e4dccb;--soft:#f1ebdc;--tipbg:#e8f4ee;--notebg:#fdecea;
--arf:'Amiri','Noto Naskh Arabic','Scheherazade New','Traditional Arabic','Geeza Pro','Arial',serif}
html.dark{--bg:#14201b;--fg:#eef3ee;--card:#1d2d26;--acc:#2a9d74;--acc2:#e0b84a;--warn:#ff8a80;--line:#32483e;--soft:#243a31;--tipbg:#1b3a2d;--notebg:#3b2423}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);font-size:calc(1.15rem*var(--s));line-height:1.55}
header{position:sticky;top:0;z-index:30;background:var(--acc);color:#fff;display:flex;gap:.5rem;align-items:center;padding:.45rem .8rem;flex-wrap:wrap}
header h1{font-size:1.15rem;margin:0;flex:1;min-width:150px}
header button,header input{font-size:1rem;border:0;border-radius:10px;padding:.45rem .8rem;cursor:pointer}
header button{background:rgba(255,255,255,.2);color:#fff}
header button:hover{background:rgba(255,255,255,.35)}
header input{background:#fff;color:#222;cursor:text;width:140px}
#side{position:fixed;left:0;top:56px;bottom:0;width:300px;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:.6rem;z-index:20;font-size:1rem}
#side h4{margin:.9rem .3rem .3rem;color:var(--acc2);text-transform:uppercase;font-size:.8rem;letter-spacing:.06em}
#side a{display:flex;gap:.5rem;align-items:center;padding:.4rem .6rem;border-radius:10px;color:var(--fg);text-decoration:none;cursor:pointer}
#side a:hover{background:var(--soft)}
#side a.on{background:var(--acc);color:#fff}
#side a .ar{font-size:1.5rem;line-height:1.2;min-width:1.8rem;text-align:center}
main{margin-left:300px;padding:1rem 1.6rem 5rem;max-width:1250px}
@media(max-width:950px){#side{transform:translateX(-102%);transition:.2s;box-shadow:0 0 30px #0005}#side.open{transform:none}main{margin-left:0;padding:1rem}}
.ar{font-family:var(--arf);direction:rtl;unicode-bidi:isolate;font-size:1.5em;line-height:1.9}
h2{font-size:calc(2rem*var(--s));margin:.2rem 0 .3rem;color:var(--acc)}
h3{font-size:calc(1.45rem*var(--s));margin:1.4rem 0 .4rem;color:var(--acc);border-bottom:2px solid var(--line);padding-bottom:.2rem}
.sub{opacity:.75;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1rem 1.3rem;margin:1rem 0}
.tip,.note{border-radius:14px;padding:.7rem 1rem;margin:.9rem 0}
.tip{background:var(--tipbg);border-left:6px solid var(--acc)}
.note{background:var(--notebg);border-left:6px solid var(--warn)}
.note::before{content:"ISTISNO: ";font-weight:800;color:var(--warn)}
.tip::before{content:"ESLATMA: ";font-weight:800;color:var(--acc)}
.hero{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
.hero .letter{font-size:calc(13rem*var(--s));line-height:1.25;color:var(--acc);min-width:calc(11rem*var(--s));text-align:center;font-family:var(--arf);direction:rtl}
.hero .meta{flex:1;min-width:260px}
.hero .meta .name{font-size:calc(2.2rem*var(--s));font-weight:800}
.hero .meta .nm-ar{font-size:calc(3rem*var(--s))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;margin-top:.5rem}
.kv b{color:var(--acc2)}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.forms div,.cell{border:2px solid var(--line);border-radius:14px;text-align:center;padding:.4rem .2rem;background:var(--card)}
.forms .ar{display:block;font-size:calc(6rem*var(--s));line-height:1.5}
.forms small,.cell small{display:block;opacity:.8;font-size:.85em}
.hk{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(9rem*var(--s)),1fr));gap:.7rem}
.cell .ar{display:block;font-size:calc(4.6rem*var(--s));line-height:1.6}
.cell small{font-weight:700;color:var(--acc)}
.exg{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(15rem*var(--s)),1fr));gap:.8rem}
.exi{border:2px solid var(--line);border-radius:14px;padding:.5rem .6rem;text-align:center;background:var(--card)}
.exi .ar{display:block;font-size:calc(3.6rem*var(--s));line-height:1.7}
.exi small{display:block;opacity:.85}
table{border-collapse:collapse;width:100%;margin:.6rem 0;background:var(--card)}
th,td{border:1px solid var(--line);padding:.45rem .7rem;text-align:left;vertical-align:middle}
th{background:var(--soft)}
td .ar{font-size:calc(2.2rem*var(--s));line-height:1.6}
.tw{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:.3rem .9rem;cursor:pointer;text-decoration:none;color:var(--fg)}
.chip:hover{background:var(--acc);color:#fff}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(8.5rem*var(--s)),1fr));gap:.7rem;direction:rtl}
.lg a{direction:ltr;border:2px solid var(--line);border-radius:16px;background:var(--card);text-align:center;padding:.3rem;text-decoration:none;color:var(--fg);cursor:pointer}
.lg a:hover{border-color:var(--acc);background:var(--tipbg)}
.lg a .ar{display:block;font-size:calc(5rem*var(--s));line-height:1.5;color:var(--acc)}
.lg a small{display:block;font-weight:700}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem}
.nav button{font-size:1.1rem;border:0;border-radius:12px;background:var(--acc);color:#fff;padding:.7rem 1.3rem;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
.fc{text-align:center;padding:1.5rem}
.fc .ar{display:block;font-size:calc(16rem*var(--s));line-height:1.4;color:var(--acc)}
.fc .ans{font-size:calc(2.4rem*var(--s));font-weight:800;min-height:3.5rem}
.fc button{font-size:1.2rem;border:0;border-radius:12px;background:var(--acc);color:#fff;padding:.7rem 1.4rem;margin:.3rem;cursor:pointer}
ul{padding-left:1.3rem}li{margin:.25rem 0}
.sp{cursor:pointer}.sp:hover{background:var(--tipbg);border-radius:10px;outline:2px dashed var(--acc)}
#brec.on{background:#c62828}.rec{outline:3px solid #c62828!important;animation:bl 1s infinite}.has::after{content:'●';color:var(--acc);font-size:.35em;vertical-align:top}@keyframes bl{50%{opacity:.4}}
#bsp.on{background:var(--acc2)}

.emo{font-size:calc(4rem*var(--s));line-height:1.2}
.learn{font-size:1.1rem;border:0;border-radius:999px;background:var(--acc2);color:#fff;padding:.6rem 1.3rem;cursor:pointer;font-weight:700}
.learn.done{background:#2e9e5b}
.pbar{height:22px;border-radius:999px;background:var(--soft);overflow:hidden;border:2px solid var(--line)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb300,#ff6b35);transition:width .4s}
.gscore{font-size:1.2rem;margin:.4rem 0}
.gq{text-align:center;margin:1rem 0}
.gbig{display:block;font-size:calc(11rem*var(--s))!important;color:var(--acc);line-height:1.3}
.gname{font-size:calc(5rem*var(--s));font-weight:800;color:var(--acc)}
.gemo{font-size:calc(9rem*var(--s));line-height:1.2}
.gch{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}
.gch button{font-size:calc(1.8rem*var(--s));border:3px solid var(--line);border-radius:20px;background:var(--card);color:var(--fg);padding:.6rem;cursor:pointer;font-weight:700}
.gch button.ar{font-size:calc(5rem*var(--s));line-height:1.4}
.gch button:hover{border-color:var(--acc);transform:scale(1.03)}
.gch button.good{background:#c8f7d4;border-color:#2e9e5b;animation:pop .5s}
.gch button.bad{background:#ffd5d0;border-color:#e53935;animation:shake .4s}
.gmsg{text-align:center;font-size:calc(1.8rem*var(--s));min-height:2.6rem;font-weight:800;margin-top:.6rem}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cf{position:fixed;bottom:-40px;font-size:2.4rem;z-index:99;pointer-events:none;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translateY(-110vh) rotate(40deg);opacity:.2}}
html.kid{--bg:#fff6dc;--fg:#2a2140;--card:#ffffff;--acc:#e8541f;--acc2:#7c4dff;--tipbg:#e3f7ff;--notebg:#ffe3e3;--warn:#c62828;--line:#ffd89b;--soft:#ffeccc}
html.kid body{font-family:'Comic Sans MS','Trebuchet MS',system-ui,sans-serif}
html.kid header{background:linear-gradient(90deg,#ff6b35,#ffb300,#7c4dff)}
html.kid .card,html.kid .exi,html.kid .cell,html.kid .forms div{border-radius:26px;border-width:3px}
html.kid .exi:nth-child(4n+1){background:#ffe3e3}html.kid .exi:nth-child(4n+2){background:#e3f3ff}html.kid .exi:nth-child(4n+3){background:#e6ffe3}html.kid .exi:nth-child(4n){background:#fff2cc}
html.kid .lg a:nth-child(5n+1){background:#ffe3e3}html.kid .lg a:nth-child(5n+2){background:#e3f3ff}html.kid .lg a:nth-child(5n+3){background:#e6ffe3}html.kid .lg a:nth-child(5n+4){background:#fff2cc}html.kid .lg a:nth-child(5n){background:#f1e3ff}
html.kid .lg a:hover{transform:rotate(-4deg) scale(1.08)}
html.kid h3{border-bottom-style:dashed}
.zg{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(10.5rem*var(--s)),1fr));gap:.7rem;direction:rtl}
.zs{direction:ltr;border:3px dashed var(--line);border-radius:20px;text-align:center;padding:.4rem;background:var(--card);min-height:calc(10rem*var(--s))}
.zs.on{border-style:solid;border-color:var(--acc);background:var(--tipbg)}
.zs.new{animation:pop .7s}
.zs .zl{display:block;font-size:calc(3rem*var(--s));line-height:1.4;color:var(--acc)}
.zs .ze{font-size:calc(3.4rem*var(--s));line-height:1.2}
.zs .zw{display:block;font-size:calc(2rem*var(--s))!important;line-height:1.5}
.zs small{display:block}
@media print{header,#side,.nav{display:none}main{margin:0}}
</style>
</head>
<body>
<header>
<button id="bmenu" title="Menyu">☰</button>
<h1>📖 Muallimi soniy — Harflar va Tajvid</h1>
<input id="q" placeholder="Qidirish…" autocomplete="off">
<button id="bm" title="Shriftni kichiklashtirish">A−</button>
<button id="bp" title="Shriftni kattalashtirish">A+</button>
<button id="brec" title="Yozish rejimi: o'z ovozingizni yozing">🎙 yozish: o'chiq</button>
<button id="bsp" title="Ovoz: tez/sekin">🔊 sekin</button>
<button id="bk" title="Bolalar rejimi">🎈</button>
<button id="bd" title="Tungi rejim">🌙</button>
</header>
<nav id="side"></nav>
<main id="main"></main>

<script>
/* ================= MA'LUMOTLAR ================= */
const FATHA='َ',KASRA='ِ',DAMMA='ُ',FT='ً',KT='ٍ',DT='ٌ',SUK='ْ',SHD='ّ',ZWJ='‍';

/* Harflar: c harf, n nomi, ar arabcha nomi, t lotincha tovush, conn=ulanadimi, mk makhraj, sf sifat */
const L=[
{c:'ا',n:'Alif',ar:'أَلِف',t:"'",conn:false,mk:"Jawf (og'iz-tomoq bo'shlig'i) — madd tovushi uchun. Hamza esa halqning eng tubidan chiqadi.",sf:"Madd harfi; jahr, rakhawa, istifal, infitah",
 w:[['أَسَدٌ','sher'],['إِبِلٌ','tuya'],['أُذُنٌ','quloq']],
 notes:["Alif <b>hech qachon harakat olmaydi</b> va so'z boshida kelmaydi. Harakatli alif — bu aslida <b>hamza</b> (أ، إ، أُ).","<b>Madd harfi:</b> fatha dan keyin sokin alif cho'ziq «o» beradi, 2 harakat: بَا، قَالَ، كِتَابٌ.","Faqat oldingi harfga ulanadi, keyingisiga <b>ulanmaydi</b>.","<b>Hamzat wasl</b> (ٱ): faqat so'z boshlanganda o'qiladi, so'z o'rtasida o'qilmaydi — «Vasl» bo'limiga qarang.","<b>Kichik alif</b> (ٰ): هَٰذَا، ذَٰلِكَ، ٱلرَّحْمَٰنِ — oddiy madd kabi cho'ziladi.","<b>Madd belgisi</b> ٓ: آ — hamza + alif, ya'ni «aa»."],
 istisno:["Yozilgan, lekin <b>o'qilmaydigan alif</b>: jam' vovidan keyingi alif (قَالُوا۟ — dumaloq nol bilan belgilanadi).","أَنَا۠ so'zidagi alif <b>faqat to'xtaganda</b> (vaqfda) o'qiladi, vaslda o'qilmaydi.","لَٰكِنَّا۠ هُوَ ٱللَّهُ (Kahf 38) — ham shunday: alif faqat vaqfda o'qiladi."],
 rel:['hamza','madd','wasl']},
{c:'ب',n:'Ba',ar:'بَاء',t:'b',conn:true,mk:"Ikki lab (shafatayn) — labning nam qismi bir-biriga yopishadi.",sf:"Jahr, shidda, istifal, infitah, izlaq + qalqala",
 w:[['بَابٌ','eshik'],['بَيْتٌ','uy'],['بَقَرَةٌ','sigir']],
 notes:["<b>Qalqala harfi</b> (قطب جد): sokin bo'lganda «urib» o'qiladi: وَيَبْقَىٰ.","Nun sokin yoki tanvindan keyin kelsa — <b>iqlab</b>: مِنۢ بَعْدِ (nun → mim).","Mim sokindan keyin kelsa — <b>ikhfo shafawiy</b>: تَرْمِيهِم بِحِجَارَةٍ.","Ba bilan mim — <b>mutajanisayn</b> idg'omi: ٱرْكَب مَّعَنَا (Hud 42).","Lam qamariy harfi: ٱلْبَيْتُ."],
 istisno:["ٱرْكَب مَّعَنَا da ba sokin bo'lsa ham <b>qalqala qilinmaydi</b> — mim ga singib ketadi (g'unna bilan)."],
 rel:['qalqala','nun','mim','idgham']},
{c:'ت',n:'Ta',ar:'تَاء',t:'t',conn:true,mk:"Til uchi + yuqori old tishlar ildizi.",sf:"Hams, shidda, istifal, infitah, ismat",
 w:[['تُفَّاحٌ','olma'],['تَمْرٌ','xurmo'],['تَاجٌ','toj']],
 notes:["Yupqa «t» — qalin ط bilan adashtirmang.","Nun sokin/tanvindan keyin — <b>ikhfo</b>: أَنتُمْ، جَنَّاتٍ تَجْرِي.","Lam shamsiy harfi: ٱلتِّينِ.","<b>Mutajanisayn</b>: قَد تَّبَيَّنَ (د→ت), وَدَّت طَّائِفَةٌ (ت→ط).","Ta marbuta (ة) alohida mavzu."],
 istisno:["أَحَطتُ، بَسَطتَ da ط → ت ga <b>to'liq singmaydi</b> (idg'om naqis): ط ning qalinligi (itbaq) qoladi."],
 rel:['nun','lam','idgham']},
{c:'ث',n:'Sa',ar:'ثَاء',t:'s̱',conn:true,mk:"Til uchi + yuqori old tishlarning uchi (til tishlar orasidan sal chiqadi).",sf:"Hams, rakhawa, istifal, infitah, ismat",
 w:[['ثَوْرٌ','buqa'],['ثَعْلَبٌ','tulki'],['ثَوْبٌ','kiyim']],
 notes:["Ingliz tilidagi <i>think</i> dagi «th» kabi; o'zbekcha «s» emas, tishlar orasidan havo oqadi.","<b>Mutajanisayn</b>: يَلْهَث ذَّٰلِكَ (ث→ذ).","Nun sokindan keyin <b>ikhfo</b>: مَنثُورًا.","Lam shamsiy: ٱلثَّمَرَاتِ."],
 istisno:[],rel:['nun','idgham','lam']},
{c:'ج',n:'Jim',ar:'جِيم',t:'j',conn:true,mk:"Til o'rtasi + qattiq tanglay (jim, shin, ya — bir joy).",sf:"Jahr, shidda, istifal, infitah, ismat + qalqala",
 w:[['جَمَلٌ','tuya'],['جَبَلٌ','tog\''],['جَنَّةٌ','jannat']],
 notes:["«dj» kabi (jon), «zh» emas.","<b>Qalqala harfi</b>: sokin bo'lsa urib o'qiladi: يَجْعَلُونَ، ٱلْحَجُّ.","<b>Ikhfo</b>: أَنجَيْنَا.","Lam qamariy: ٱلْجَنَّةُ."],
 istisno:[],rel:['qalqala','nun','lam']},
{c:'ح',n:'Ḥa',ar:'حَاء',t:'ḥ',conn:true,mk:"Halqning o'rta qismi (awsat halq).",sf:"Hams, rakhawa, istifal, infitah, ismat",
 w:[['حِصَانٌ','ot'],['حَلِيبٌ','sut'],['حَجَرٌ','tosh']],
 notes:["Tomoqning o'rtasidan, nafas bilan chiqadigan <b>siqiq «h»</b> — ه bilan almashtirmang.","<b>Izhor halqiy</b> harfi: nun sokin/tanvin keyin — aniq o'qiladi: مِنْ حَكِيمٍ.","Lam qamariy: ٱلْحَمْدُ."],
 istisno:[],rel:['nun','lam','makhraj']},
{c:'خ',n:'Xo',ar:'خَاء',t:'x',conn:true,mk:"Halqning yuqori qismi (adna halq, og'izga yaqin).",sf:"Hams, rakhawa, isti'lo (qalin), infitah, ismat",
 w:[['خُبْزٌ','non'],['خَرُوفٌ','qo\'y'],['خَيْمَةٌ','chodir']],
 notes:["<b>Isti'lo harfi</b> — qalin (tafxim) o'qiladi.","<b>Izhor halqiy</b>: مِنْ خَيْرٍ.","Lam qamariy: ٱلْخَيْرُ."],
 istisno:[],rel:['tafxim','nun','lam']},
{c:'د',n:'Dal',ar:'دَال',t:'d',conn:false,mk:"Til uchi + yuqori old tishlar ildizi.",sf:"Jahr, shidda, istifal, infitah, ismat + qalqala",
 w:[['دَجَاجَةٌ','tovuq'],['دُبٌّ','ayiq'],['دَرْسٌ','dars']],
 notes:["<b>Qalqala harfi</b>: يَدْخُلُونَ، أَحَدٌ (vaqfda kuchliroq).","<b>Ulanmaydi</b> (keyingi harfga).","<b>Mutajanisayn</b>: قَد تَّبَيَّنَ (د→ت), أَثْقَلَت دَّعَوَا (ت→د).","Nun sokindan keyin <b>ikhfo</b>: أَندَادًا. Lam shamsiy: ٱلدِّينِ."],
 istisno:["قَد تَّبَيَّنَ da dal ga qalqala <b>berilmaydi</b> — idg'om bor."],
 rel:['qalqala','idgham','nun','lam']},
{c:'ذ',n:'Zal',ar:'ذَال',t:'ḏ',conn:false,mk:"Til uchi + yuqori old tishlarning uchi.",sf:"Jahr, rakhawa, istifal, infitah, ismat",
 w:[['ذَهَبٌ','oltin'],['ذُرَةٌ','makkajo\'xori'],['ذِئْبٌ','bo\'ri']],
 notes:["Ingliz <i>this</i> dagi «th» kabi — o'zbekcha «z» emas.","Ulanmaydi.","<b>Mutajanisayn</b>: إِذ ظَّلَمْتُمْ (ذ→ظ, Zuxruf 39).","<b>Ikhfo</b>: مَن ذَا ٱلَّذِي. Lam shamsiy: ٱلذِّكْرَىٰ."],
 istisno:[],rel:['idgham','nun','lam']},
{c:'ر',n:'Ro',ar:'رَاء',t:'r',conn:false,mk:"Til uchi (nun dan sal orqada) + yuqori tanglay.",sf:"Jahr, tawassut, istifal, infitah, izlaq + takrir (tafxim yoki tarqiq)",
 w:[['رَجُلٌ','erkak'],['رُمَّانٌ','anor'],['رَأْسٌ','bosh']],
 notes:["<b>Takrir</b> sifati bor, lekin tilni titratib yubormang!","<b>Tafxim va tarqiq</b> qoidalari alohida mavzuda (Ra).","Nun→ra: <b>idg'om bila g'unna</b>: مِنْ رَبِّهِمْ. Lam→ra: قُل رَّبِّ.","Ulanmaydi. Lam shamsiy: ٱلرَّحْمَٰنِ."],
 istisno:["فِرْقٍ (Shuaro 63) — ra da <b>ikki vajh</b> joiz: tafxim ham, tarqiq ham."],
 rel:['ra','nun','lam','idgham']},
{c:'ز',n:'Za',ar:'زَاي',t:'z',conn:false,mk:"Til uchi + pastki old tishlar ustki qismi.",sf:"Jahr, rakhawa, istifal, infitah, ismat + safir (hushtak)",
 w:[['زَهْرَةٌ','gul'],['زَيْتٌ','yog\''],['زُجَاجٌ','shisha']],

/* ============ YORDAMCHI FUNKSIYALAR ============ */
const AR='[\\u0600-\\u06FF\\u0750-\\u077F\\u08A0-\\u08FF\\uFB50-\\uFDFF\\uFE70-\\uFEFF\\u200D]+';
const RX=new RegExp(AR+'(?:[ \\u00A0]+'+AR+')*','g');
const fmt=s=>String(s).replace(RX,m=>'<span class="ar">'+m+'</span>');
const forms=(c,conn)=>{const f=ZWJ+c;return{iso:c,fin:f,ini:conn?c+ZWJ:c,med:conn?ZWJ+c+ZWJ:f}};

/* Mavzu bloklari renderi */
function blocks(b){return b.map(x=>{
 if(x.h)return '<h3>'+fmt(x.h)+'</h3>';
 if(x.p)return '<p>'+fmt(x.p)+'</p>';
 if(x.tip)return '<div class="tip">'+fmt(x.tip)+'</div>';
 if(x.note)return '<div class="note">'+fmt(x.note)+'</div>';
 if(x.list)return '<ul>'+x.list.map(i=>'<li>'+fmt(i)+'</li>').join('')+'</ul>';
 if(x.ex)return '<div class="exg">'+x.ex.map(e=>'<div class="exi">'+(e[2]?'<div class="emo">'+e[2]+'</div>':'')+'<span class="ar">'+e[0]+'</span><small>'+fmt(e[1]||'')+'</small></div>').join('')+'</div>';
 if(x.tbl){const[h,...r]=x.tbl;return '<div class="tw"><table><tr>'+h.map(c=>'<th>'+fmt(c)+'</th>').join('')+'</tr>'+r.map(row=>'<tr>'+row.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>').join('')+'</table></div>';}
 if(x.raw)return x.raw;
 return '';}).join('');}

/* ============ HARF DARSI ============ */
function letterPage(i){
 const l=L[i],F=forms(l.c,l.conn),t=l.t;
 let h='<h2>'+(i+1)+'-dars. '+l.c+' — '+l.n+'</h2><p class="sub">'+l.ar.replace(RX,'')+' Harfni alohida o\'rganamiz: shakli, tovushi, makhraji, harakatlar bilan, so\'zlarda va unga tegishli tajvid qoidalari.</p>';
 h+='<div class="card hero"><div class="letter sp" data-say="'+l.ar+'" data-aud="h'+i+'" title="Bosing — ovoz">'+l.c+'</div><div class="meta"><div class="name">'+l.n+' <span class="ar nm-ar">'+l.ar+'</span></div><div class="kv"><b>Tovushi:</b><span>«'+t+'»</span><b>Makhraj:</b><span>'+fmt(l.mk)+'</span><b>Sifatlari:</b><span>'+l.sf+'</span><b>Ulanishi:</b><span>'+(l.special?'—':(l.conn?'Ikki tomonga ulanadi':'Faqat oldingi harfga ulanadi (keyingiga ulanmaydi)'))+'</span></div></div></div>';
 h+='<div style="margin:.7rem 0"><button class="learn'+(isL(i)?' done':'')+'" id="lbtn" onclick="toggleLearn('+i+')">'+(isL(i)?'⭐ O\'rgandim!':'☆ Men bu harfni o\'rgandim')+'</button></div>';
 if(!l.special||l.special==='hamza'||l.special==='tam'){
  h+='<h3>Harfning to\'rt shakli</h3><div class="forms"><div><small>Yolg\'iz</small><span class="ar">'+F.iso+'</span></div><div><small>Boshida</small><span class="ar">'+F.ini+'</span></div><div><small>O\'rtasida</small><span class="ar">'+F.med+'</span></div><div><small>Oxirida</small><span class="ar">'+F.fin+'</span></div></div>';
 }
 if(l.special==='lamalif'){
  h+='<h3>Birikma shakllari</h3><div class="forms"><div><small>Yolg\'iz</small><span class="ar">لا</span></div><div><small>Oxirida (ulanib)</small><span class="ar">ـلا</span></div><div><small>Harakat bilan</small><span class="ar">لَا</span></div><div><small>Kichik alifli</small><span class="ar">لَٰ</span></div></div>';
 }
 /* harakatlar */
 const base=(l.c==='ا')?'أ':(l.special==='tam'?'ت':l.c);
 if(l.special!=='lamalif'){
  const cell=(a,s)=>'<div class="cell"><span class="ar">'+a+'</span><small>'+s+'</small></div>';
  const bt=(l.c==='ا'||l.c==='ء')?"'":(l.special==='tam'?'t':t);
  const sh=base;
  const Q=['خ','ص','ض','ط','ظ','غ','ق','ر'].includes(l.c);
  const A=Q?'o':'a',AA=Q?'ō':'ā';
  if(Q)h+='<div class="tip"><b>Qalin harf:</b> fatha «a» emas, <b>«o»</b> ga yaqin o\'qiladi ('+bt+'o, '+bt+'ō). Kasra va dammada: '+bt+'i, '+bt+'u.</div>';
  h+='<h3>Harakatlar bilan mashq</h3><div class="hk">'
   +cell(sh+FATHA,bt+A)+cell(sh+KASRA,bt+'i')+cell(sh+DAMMA,bt+'u')
   +cell(sh+FT,bt+A+'n')+cell(sh+KT,bt+'in')+cell(sh+DT,bt+'un')+'</div>';
  h+='<h3>Madd (cho\'zish) va sukun, shadda</h3><div class="hk">'
   +cell(sh+FATHA+'ا',bt+AA)+cell(sh+KASRA+'ي',bt+'ī')+cell(sh+DAMMA+'و',bt+'ū')
   +cell('أَ'+sh+SUK,"a"+bt)+cell('أَ'+sh+SHD+FATHA,'a'+bt+bt+A)+cell(sh+FATHA+'ٰ',bt+AA+' (kichik alif)')+'</div>';
 }
 h+='<h3>So\'zlarda</h3>'+blocks([{ex:l.w.map(w=>[w[0],w[1],EMO[bare(w[0])]||''])}]);
 if(l.notes.length)h+='<h3>Qoidalar va eslatmalar</h3>'+blocks([{list:l.notes}]);
 if(l.istisno&&l.istisno.length)l.istisno.forEach(n=>h+=blocks([{note:n}]));
 if(l.rel&&l.rel.length)h+='<h3>Shu harf bilan bog\'liq tajvid mavzulari</h3><div class="chips">'+l.rel.map(r=>'<a class="chip" onclick="go(\''+r+'\')">'+(TITLE[r]||r)+'</a>').join('')+'</div>';
 return h;
}

 {h:'Ra qalin (tafxim) bo\'ladigan holatlar'},
 {list:['Ra da <b>fatha yoki damma</b> bo\'lsa: رَبِّ، رُسُلٌ، رَحْمَةٌ.','Ra sokin va oldidagi harakat <b>fatha/damma</b>: أَرْسَلَ، ٱلْقُرْآنِ.','Ra sokin, oldidan <b>aroziy kasra</b> (hamzat wasl kasrasi): ٱرْجِعُوا، أَمِ ٱرْتَابُوا.','Ra sokin, oldidan <b>asliy kasra</b>, lekin keyin isti\'lo harfi (bir so\'zda): قِرْطَاسٍ، فِرْقَةٍ، مِرْصَادًا.','Vaqfda: ra dan oldin sokin <b>isti\'lo</b> harfi bo\'lsa: ٱلْمِصْرِ، ٱلْقِطْرِ.']},
 {ex:[['رَبِّ','fatha'],['رُسُلٌ','damma'],['أَرْسَلَ','sokin, fatha dan keyin'],['ٱرْجِعُوا','aroziy kasra'],['قِرْطَاسٍ','isti\'lo harfi bor']]},
 {h:'Ra yupqa (tarqiq) bo\'ladigan holatlar'},
 {list:['Ra da <b>kasra</b> bo\'lsa: رِزْقٌ، بِرَبِّ.','Ra sokin, oldidan <b>asliy kasra</b>, keyin isti\'lo harfi yo\'q: فِرْعَوْنَ، مِرْيَةٍ.','Vaqfda ra dan oldin <b>sokin ya</b> bo\'lsa: خَبِيرٌ → خَبِيرْ، قَدِيرْ، خَيْرْ.','Vaqfda oldin kasra, orada sokin harf (isti\'lo emas): ٱلسِّحْرِ.']},
 {ex:[['رِزْقًا','kasra'],['فِرْعَوْنَ','asliy kasra, isti\'losiz'],['مِرْيَةٍ','tarqiq'],['خَبِيرٌ','vaqfda ya dan keyin']]},
 {note:'فِرْقٍ (Shuaro 63) — asliy kasra va keyin qof (isti\'lo): ikkita vajh joiz — <b>tarqiq ham, tafxim ham</b>.'},
 {note:'ٱلْمِصْرِ، ٱلْقِطْرِ (vaqfda) — ra dan oldin sokin isti\'lo harfi (ص ط) bo\'lgani uchun <b>tafxim</b>, garchi undan oldin kasra bo\'lsa ham.'},
 {tip:'Ra ni takrir bilan (tilni titratib) o\'qimang. Til uchi bir marta tanglayga tegadi.'}
]);

add('madd','Tajvid','Madd: barcha turlari',"Asliy, furu'iy, lazim, arid, lin, silah, iwad, badal…",[
 {h:'Madd harflari va ularning sharti'},
 {tbl:[['Harf','Sharti','Misol'],
  ['ا (alif)','Oldidagi harf <b>fatha</b>','قَالَ'],
  ['و (vov sokin)','Oldidagi harf <b>damma</b>','يَقُولُ'],
  ['ي (ya sokin)','Oldidagi harf <b>kasra</b>','قِيلَ'],
  ['ٰ (kichik alif)','Fatha dan keyin','هَٰذَا']]},
 {tip:'<b>Madd tovushi sababsiz</b> 2 harakat (asliy). Sabab (hamza yoki sukun) bo\'lsa — 4, 5 yoki 6 harakatgacha (furuiy).'},
 {h:'1. Madd tabiiy (asliy) — 2 harakat'},
 {ex:[['قَالَ','alif'],['يَقُولُ','vov'],['قِيلَ','ya'],['هَٰذَا','kichik alif']]},
 {h:'2. Madd muttasil (ulangan) — 4–5 harakat (vojib)'},
 {p:'Madd harfidan keyin <b>bir so\'z ichida</b> hamza keladi.'},
 {ex:[['جَاءَ','alif+hamza'],['ٱلسَّمَاءِ','alif+hamza'],['سُوءٍ','vov+hamza'],['جِيءَ','ya+hamza']]},
 {h:'3. Madd munfasil (ajralgan) — 4–5 harakat (joiz)'},
 {p:'Madd harfi bir so\'z oxirida, hamza <b>keyingi so\'z boshida</b>.'},
 {ex:[['فِي أَنفُسِكُمْ','ya | hamza'],['يَا أَيُّهَا','alif | hamza'],['قُوا أَنفُسَكُمْ','vov | hamza'],['بِمَا أُنزِلَ','alif | hamza']]},
 {h:'4. Madd lazim — 6 harakat'},
 {p:'Madd harfidan keyin <b>asliy sukun</b> (yoki shadda) — doim 6 harakat.'},
 {tbl:[['Turi','Tavsifi','Misol'],
  ['Kalimiy musaqqal','So\'zda, shadda bilan','ٱلضَّالِّينَ، ٱلْحَاقَّةُ، دَابَّةٍ'],
  ['Kalimiy mukhaffaf','So\'zda, shaddasiz (Yunus 51, 91)','آلْـَٔانَ'],
  ['Harfiy musaqqal','Harf nomi ichida, idg\'om bilan','الٓمٓ (لام+ميم)'],
  ['Harfiy mukhaffaf','Harf nomi, shaddasiz','قٓ  نٓ  صٓ']]},
 {tip:'Ochiluvchi harflar (fawatih) dan <b>نقص عسلكم</b> 8 harfda mad lazim harfiy bor (6 harakat). <b>حي طهر</b> 5 harfda — mad tabiiy (2 harakat).'},
 {note:'Ayn (ع) da mad lazim harfiy: <b>4 yoki 6</b> harakat joiz: عٓسٓقٓ، كٓهيعٓصٓ.'},
 {h:'5. Madd arid lissukun — 2, 4 yoki 6'},
 {p:'Madd dan keyin so\'z oxirida harf, <b>vaqf qilinganda</b> sukun paydo bo\'ladi.'},
 {ex:[['ٱلْعَالَمِينَ','vaqfda'],['نَسْتَعِينُ','vaqfda'],['ٱلرَّحِيمِ','vaqfda'],['يُوقِنُونَ','vaqfda']]},
 {h:'6. Madd lin — 2, 4 yoki 6 (vaqfda)'},
 {p:'Fatha dan keyin sokin vov/ya, undan keyin so\'z oxirida vaqf.'},
 {ex:[['خَوْفٍ','vov lin'],['بَيْتٍ','ya lin'],['قُرَيْشٍ','ya lin'],['ٱلصَّيْفِ','ya lin']]},
 {h:'7. Madd badal — 2 harakat'},
 {p:'Hamza <b>madd harfidan oldin</b> keladi.'},
 {ex:[['آمَنُوا','badal'],['أُوتُوا','badal'],['إِيمَانًا','badal']]},
 {h:'8. Madd iwad — 2 harakat (vaqfda)'},
 {p:'Fathatan bilan tugagan so\'zda vaqf: tanvin alifga almashadi.'},
 {ex:[['عَلِيمًا → عَلِيمَا','iwad'],['حَكِيمًا → حَكِيمَا','iwad']]},
 {note:'Ta marbuta bilan tugagan so\'zlarda iwad <b>bo\'lmaydi</b>: رَحْمَةً → رَحْمَهْ (ta → ha, alif yo\'q).'},
 {note:'Nun ta\'kid xafifa ga: لَنَسْفَعًا (Alaq 15)، وَلَيَكُونًا (Yusuf 32)، إِذًا — vaqfda tanvin kabi alifga aylanadi.'},
 {h:'9. Silah (ha kinoya ning cho\'zilishi)'},
 {p:'Ha kinoya (olmosh «u») <b>ikki harakatli harf orasida</b> bo\'lsa cho\'ziladi.'},
 {tbl:[['Turi','Qoida','Misol'],
  ['Silah sug\'ro','Keyin hamza yo\'q → 2 harakat','بِهِۦ، لَهُۥ'],
  ['Silah kubro','Keyin hamza → 4–5 harakat','مَالَهُۥٓ أَخْلَدَهُۥ']]},
 {note:'Ha kinoya <b>sokin harfdan keyin</b> kelsa silah bo\'lmaydi: فِيهِ هُدًى، مِنْهُ آيَاتٌ.'},
 {note:'Istisno: فِيهِۦ مُهَانًا (Furqon 69) — sokindan keyin bo\'lsa ham <b>silah bor</b> (ya cho\'ziladi).'},
 {note:'Silah <b>o\'qilmaydigan</b> so\'zlar: أَرْجِهْ (Aʼrof 111, Shuaro 36), فَأَلْقِهْ (Naml 28), يَرْضَهُ لَكُمْ (Zumar 7), يَأْتِهِ (Toha 75), يَتَّقْهِ (Nur 52); عَلَيْهُ ٱللَّهَ (Fath 10) va أَنسَانِيهُ (Kahf 63) da — damma.'},
 {h:'10. Madd farq'},
 {p:'Istifham hamzasi + hamzat wasl: <b>6 harakat</b> (yoki tashil): آلذَّكَرَيْنِ، آللَّهُ (Yunus 59, Naml 59).'},
 {h:'Harakat sonlari xulosasi'},
 {tbl:[['Madd','Harakat'],['Tabiiy, Badal, Iwad, Silah sug\'ro','2'],['Muttasil, Munfasil, Silah kubro','4–5 (Hafs)'],['Arid, Lin arid','2, 4 yoki 6'],['Lazim, Farq','6']]}
]);

add('idgham','Tajvid','Idg\'om turlari (harfma-harf)',"Mislayn, mutajanisayn, mutaqoribayn va istisnolar",[

  ['ت ← ط','وَدَّت طَّائِفَةٌ','waddaṭṭā\'ifatun','Ta to ga singadi (qalin)'],
  ['ط ← ت','أَحَطتُ','aḥaṭṭu (qalin)','Idg\'om naqis: to ning qalinligi qoladi'],

  ['ذ ← ظ','إِذ ظَّلَمْتُمْ','izẓẓalamtum','Zal zo ga singadi (qalin)'],
  ['ث ← ذ','يَلْهَث ذَّٰلِكَ','yalhaḏḏālika','Sa zal ga singadi'],
  ['ب ← م','ٱرْكَب مَّعَنَا','arkammaʿanā','Ba mim ga singadi (g\'unna bilan)']]},

 {tbl:[['Juft','Misol','O\'qilishi','Izoh'],
  ['ل ← ر','قُل رَّبِّ','qurrabbi','Lom ra ga singadi (g\'unnasiz)'],

  ['ق ← ك','أَلَمْ نَخْلُقكُّم','alam nakhlukkum','Qof kof ga singadi']]},
 {note:'Mutaqoribayn idg\'omidagi istisno: <b>بَلْ رَانَ</b> — lom ra ga singmaydi, sakta bilan o\'qiladi: bal (sakta) rāna.'},
 {h:'Nun sokin/tanvin va mim idg\'omi'},

]);

let RATE=.6,VOICE=null;
function pickVoice(){const v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];VOICE=v.find(x=>/^ar/i.test(x.lang))||null;}

/* IndexedDB: o'z yozuvlari */
let DB=null;
const dbReq=indexedDB.open('ms_audio',1);
dbReq.onupgradeneeded=()=>dbReq.result.createObjectStore('a');
dbReq.onsuccess=()=>{DB=dbReq.result;markHas();};
const dbGet=k=>new Promise(r=>{if(!DB)return r(null);const q=DB.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});
const dbPut=(k,v)=>new Promise(r=>{if(!DB)return r();const t=DB.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=r;});
const dbKeys=()=>new Promise(r=>{if(!DB)return r([]);const q=DB.transaction('a').objectStore('a').getAllKeys();q.onsuccess=()=>r(q.result);q.onerror=()=>r([]);});
async function markHas(){const ks=new Set(await dbKeys());document.querySelectorAll('#main [data-aud]').forEach(x=>x.classList.toggle('has',ks.has(x.dataset.aud)));}
function tts(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';if(VOICE)u.voice=VOICE;u.rate=RATE;speechSynthesis.speak(u);}
async function play(text,aud){
 text=text.replace(/[‍۟۠]/g,'').trim();
 if(aud){const bl=await dbGet(aud);if(bl){new Audio(URL.createObjectURL(bl)).play();return;}
  const a=new Audio('audio/'+aud+'.mp3');a.onerror=()=>tts(text);a.play().catch(()=>tts(text));return;}
 tts(text);}
let REC=false,MR=null,RECEL=null;
async function recToggle(el){
 if(MR&&MR.state==='recording'){MR.stop();return;}
 if(!el.dataset.aud){alert('Bu joyga yozib bo\'lmaydi. Harf darsidagi harf, bo\'g\'in yoki so\'zni tanlang.');return;}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
  const ch=[];MR=new MediaRecorder(st);RECEL=el;el.classList.add('rec');
  MR.ondataavailable=e=>ch.push(e.data);
  MR.onstop=async()=>{st.getTracks().forEach(t=>t.stop());el.classList.remove('rec');await dbPut(el.dataset.aud,new Blob(ch,{type:MR.mimeType||'audio/webm'}));markHas();};
  MR.start();}catch(err){alert('Mikrofonga ruxsat berilmadi: '+err.message);}
}

function burst(em){for(let i=0;i<16;i++){const s=document.createElement('span');s.className='cf';s.textContent=em||['🎉','⭐','✨','🌟'][i%4];s.style.left=(5+Math.random()*90)+'vw';s.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200);}}
function beep(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;g.gain.value=.08;o.start();o.stop(c.currentTime+(ok?.18:.3));}catch(e){}}
function toggleLearn(i){const k=LEARN.indexOf(i);if(k>=0)LEARN.splice(k,1);else{LEARN.push(i);burst();beep(true);}
 try{localStorage.setItem('ms_learn',JSON.stringify(LEARN))}catch(e){}
 const b=document.getElementById('lbtn');if(b){b.className='learn'+(isL(i)?' done':'');b.textContent=isL(i)?"⭐ O'rgandim!":"☆ Men bu harfni o'rgandim";}
 buildSide(document.getElementById('q').value);}
/* O'yin */
let G={m:0,st:0,s:0,b:0,a:null,lock:false};try{G.b=+localStorage.getItem('ms_best')||0}catch(e){}
function gamePage(){setTimeout(gNext,0);
 return '<h2>🎮 O\'yin: harfni top!</h2><p class="sub">To\'g\'ri javob — yulduzcha ⭐. Ketma-ket 5 ta topsang — katta mukofot 🏆</p><div class="card"><div class="chips"><a class="chip" onclick="gMode(0)">1. Harf → nomi</a><a class="chip" onclick="gMode(1)">2. Nomi → harf</a><a class="chip" onclick="gMode(2)">3. Rasm → qaysi harf?</a></div><div class="gscore">⭐ <b id="gs">0</b> &nbsp; 🔥 ketma-ket: <b id="gst">0</b> &nbsp; 🏆 eng yaxshi: <b id="gb">0</b></div><div id="gq" class="gq"></div><div id="gch" class="gch"></div><div id="gmsg" class="gmsg"></div></div>';}
function gMode(m){G.m=m;G.st=0;gNext();}
function gNext(){const q=document.getElementById('gq');if(!q)return;G.lock=false;
 const ci=Math.floor(Math.random()*28),idx=[ci];while(idx.length<4){const r=Math.floor(Math.random()*28);if(!idx.includes(r))idx.push(r);}
 idx.sort(()=>Math.random()-.5);G.a=ci;const l=L[ci];let qh,ch;
 if(G.m===0){qh='<span class="ar gbig">'+l.c+'</span><div>Bu qaysi harf?</div>';ch=idx.map(i=>'<button onclick="gAns(this,'+i+')">'+L[i].n+'</button>').join('');}
 else if(G.m===1){qh='<div class="gname">'+l.n+'</div><div>Qaysi harf?</div>';ch=idx.map(i=>'<button class="ar" onclick="gAns(this,'+i+')">'+L[i].c+'</button>').join('');}
 else{const w=l.w[0];qh='<div class="gemo">'+(EMO[bare(w[0])]||'❓')+'</div><div>'+w[1]+' — qaysi harfdan boshlanadi?</div>';ch=idx.map(i=>'<button class="ar" onclick="gAns(this,'+i+')">'+L[i].c+'</button>').join('');}
 q.innerHTML=qh;document.getElementById('gch').innerHTML=ch;document.getElementById('gmsg').textContent='';
 document.getElementById('gs').textContent=G.s;document.getElementById('gst').textContent=G.st;document.getElementById('gb').textContent=G.b;}
function gAns(b,i){if(G.lock)return;const msg=document.getElementById('gmsg');
 if(i===G.a){G.lock=true;G.s++;G.st++;if(G.st>G.b){G.b=G.st;try{localStorage.setItem('ms_best',G.b)}catch(e){}}
  b.classList.add('good');beep(true);
  const pr=['Barakalla! 🎉','Zo\'r! ⭐','Juda yaxshi! 👏','Ofarin! 🌟','Super! 🚀'];msg.textContent=G.st%5===0?'🏆 Ajoyib! '+G.st+' ta ketma-ket!':pr[Math.floor(Math.random()*pr.length)];
  burst(G.st%5===0?'🏆':null);document.getElementById('gs').textContent=G.s;document.getElementById('gst').textContent=G.st;document.getElementById('gb').textContent=G.b;
  setTimeout(gNext,1300);}
 else{G.st=0;beep(false);b.classList.add('bad');b.disabled=true;msg.textContent='Yana urinib ko\'r 💪';document.getElementById('gst').textContent=0;}}
document.getElementById('bk').onclick=()=>{document.documentElement.classList.remove('dark');document.documentElement.classList.toggle('kid');try{localStorage.setItem('ms_kid',document.documentElement.classList.contains('kid')?1:0)}catch(e){}};
try{if(localStorage.getItem('ms_kid')==='1'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('kid');}}catch(e){}

/* ============ HAYVONLAR BOG'I ============ */
const ZOO=[['أَسَد','sher','🦁'],['بَقَرَة','sigir','🐄'],['تِمْسَاح','timsoh','🐊'],['ثَعْلَب','tulki','🦊'],['جَمَل','tuya','🐫'],['حِصَان','ot','🐴'],['خُفَّاش','ko\'rshapalak','🦇'],['دُبّ','ayiq','🐻'],['ذِئْب','bo\'ri','🐺'],['رَنْجَة','seld baliq','🐟'],['زَرَافَة','jirafa','🦒'],['سَمَكَة','baliq','🐠'],['شَاة','qo\'y','🐑'],['صَقْر','lochin','🦅'],['ضِفْدَع','baqa','🐸'],['طَاوُوس','tovus','🦚'],['ظَبْي','kiyik','🦌'],['عُصْفُور','chumchuq','🐤'],['غُرَاب','qarg\'a','🐦'],['فِيل','fil','🐘'],['قِرْد','maymun','🐒'],['كَلْب','it','🐶'],['لَقْلَق','laylak','🦢'],['مَاعِز','echki','🐐'],['نَمْلَة','chumoli','🐜'],['هِرَّة','mushuk','🐱'],['وَزَّة','g\'oz','🦆'],['يَمَامَة','kaptar','🕊️']];
let Z=[];try{Z=JSON.parse(localStorage.getItem('ms_zoo')||'[]')}catch(e){}
let ZA=null,ZLOCK=false;
function zooPage(){setTimeout(()=>{zGrid();zNext();},0);
 return '<h2>🐾 Hayvonlar bog\'i</h2><p class="sub">Hayvonchaning nomi qaysi harfdan boshlanadi? To\'g\'ri topsang, hayvonchani o\'z uyiga qo\'yamiz! Uyga bossang, nomini o\'qib beradi.</p><div class="card"><div id="zq" class="gq"></div><div id="zch" class="gch"></div><div id="zmsg" class="gmsg"></div></div><h3>Hayvonlar uylari (<span id="zc">0</span>/28)</h3><div id="zgrid" class="zg"></div><p><a class="chip" onclick="zReset()">🔄 Boshidan boshlash</a></p>';}
function zGrid(newI){const g=document.getElementById('zgrid');if(!g)return;
 g.innerHTML=L.slice(0,28).map((l,i)=>{const a=ZOO[i],on=Z.includes(i);
  return '<div class="zs'+(on?' on':'')+(i===newI?' new':'')+'"><span class="ar zl">'+l.c+'</span>'+(on?'<div class="ze">'+a[2]+'</div><span class="ar zw">'+a[0]+'</span><small>'+a[1]+'</small>':'<div class="ze">🏠</div><small>bo\'sh</small>')+'</div>';}).join('');
 const c=document.getElementById('zc');if(c)c.textContent=Z.length;}
function zNext(){const q=document.getElementById('zq');if(!q)return;ZLOCK=false;
 const rest=[...Array(28).keys()].filter(i=>!Z.includes(i));
 if(!rest.length){q.innerHTML='<div class="gemo">🏆</div><div>Barakalla! Hamma hayvonchalar o\'z uyida!</div>';document.getElementById('zch').innerHTML='';burst('🐾');return;}
 const ci=rest[Math.floor(Math.random()*rest.length)],idx=[ci];while(idx.length<4){const r=Math.floor(Math.random()*28);if(!idx.includes(r))idx.push(r);}
 idx.sort(()=>Math.random()-.5);ZA=ci;const a=ZOO[ci];
 q.innerHTML='<div class="gemo">'+a[2]+'</div><span class="ar" style="display:block;font-size:calc(4rem*var(--s))">'+a[0]+'</span><div>'+a[1]+' — qaysi harfdan boshlanadi?</div>';
 document.getElementById('zch').innerHTML=idx.map(i=>'<button class="ar" onclick="zAns(this,'+i+')">'+L[i].c+'</button>').join('');
 document.getElementById('zmsg').textContent='';}
function zAns(b,i){if(ZLOCK)return;const m=document.getElementById('zmsg');
 if(i===ZA){ZLOCK=true;Z.push(ZA);try{localStorage.setItem('ms_zoo',JSON.stringify(Z))}catch(e){}
  b.classList.add('good');beep(true);burst(ZOO[ZA][2]);m.textContent='Barakalla! '+ZOO[ZA][1]+' o\'z uyiga kirdi 🏠';zGrid(ZA);setTimeout(zNext,1500);}
 else{beep(false);b.classList.add('bad');b.disabled=true;m.textContent='Yana urinib ko\'r 💪';}}
function zReset(){if(!confirm('Hamma hayvonlar uylaridan chiqarilsinmi?'))return;Z=[];try{localStorage.setItem('ms_zoo','[]')}catch(e){}zGrid();zNext();}
setScale(SC);buildSide();render();
</script>
